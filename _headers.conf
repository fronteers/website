# Netlify custom headers, copied to dist/_headers by Eleventy.
# Docs: https://docs.netlify.com/manage/routing/headers/
#
# Netlify merges the values of a header when a path matches several rules,
# so the Cache-Control rules below must never overlap. That is why there is
# no catch-all Cache-Control and no /assets/* or /assets/css/* rule.
#
# Netlify's CDN caches everything until the next deploy and purges on deploy,
# so these values only control how long browsers keep a copy.

/*
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin

# HTML, feeds and sitemap: news has to show up within an hour.
# Fresh for 10 minutes, then at most 50 more minutes stale while the browser
# fetches the new version in the background.
/
  Cache-Control: public, max-age=600, stale-while-revalidate=3000
/nl/*
  Cache-Control: public, max-age=600, stale-while-revalidate=3000
/en/*
  Cache-Control: public, max-age=600, stale-while-revalidate=3000
/feeds/*
  Cache-Control: public, max-age=600, stale-while-revalidate=3000
/sitemap.xml
  Cache-Control: public, max-age=600, stale-while-revalidate=3000

# Bundled CSS, referenced as style.css?v=<build time>: every build gets a new
# URL, so the browser may keep it forever.
/assets/css/style.css
  Cache-Control: public, max-age=31536000, immutable

# Unversioned CSS and JS: fresh for a day, then revalidated in the background.
/assets/css/darkmode-*
  Cache-Control: public, max-age=86400, stale-while-revalidate=604800
/assets/js/*
  Cache-Control: public, max-age=86400, stale-while-revalidate=604800

# Fonts, images and downloads change a few times a year: fresh for a week,
# then revalidated in the background. Give a changed file a new name to
# make the change visible immediately.
/assets/fonts/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
/assets/images/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
/assets/company-logos/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
/assets/favicon/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
/_img/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
/downloads/*
  Cache-Control: public, max-age=604800, stale-while-revalidate=2592000
